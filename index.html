    <style>
      /* Until the app is ready, everything around the page is splash-colored (no white strip at launch). */
      html { background-color: #7F1A1F; }
      html[data-theme='dark'] { background-color: #141414; }
      /* Boot splash. It sits above #root as its own layer and fades out once the first real screen is ready
         (src/lib/splash.ts). <BootScreen> reuses these styles if a full-screen load happens later.
         Logo and title stay still so the iOS launch image hands off without a jump; only the rest fades in. */
      .splash { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 0 24px; color: #FFFFFF; text-align: center; overflow: hidden;
        font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; -webkit-user-select: none; user-select: none;
        background: linear-gradient(180deg, #B3262D 0%, #7F1A1F 100%);
        transition: opacity 320ms ease, visibility 0s linear 320ms; }
      [data-theme='dark'] .splash { background: #141414; }
      .splash--out { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash--out .splash-logo { transform: scale(1.06); }
      .splash-logo { display: block; width: 112px; height: 112px; border-radius: 26px; transition: transform 320ms ease; }
      .splash-title { margin: 22px 0 0; font-size: 22px; line-height: 27px; font-weight: 700; letter-spacing: -0.01em; }
      .splash-sub { margin: 4px 0 0; font-size: 13px; line-height: 18px; font-weight: 500; letter-spacing: 0.24em; opacity: 0.78; animation: splash-fade 400ms 120ms both; }
      .splash-bar { position: relative; overflow: hidden; width: 120px; height: 3px; margin-top: 28px; border-radius: 999px; background: rgb(255 255 255 / 0.2);
        animation: splash-fade 400ms 260ms both; }
      .splash-bar > span { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: #FFFFFF; animation: splash-slide 1.15s ease-in-out infinite; }
      .splash-tag { position: absolute; bottom: calc(28px + var(--safe-bottom, env(safe-area-inset-bottom))); left: 0; right: 0; margin: 0; font-size: 11px; letter-spacing: 0.16em; opacity: 0.55;
        animation: splash-fade 400ms 260ms both; }
      .splash--static .splash-sub, .splash--static .splash-bar, .splash--static .splash-tag { animation: none; }
      .splash-en, html[lang='en'] .splash-zh { display: none; }
      html[lang='en'] .splash-en { display: inline; }
      @keyframes splash-fade { from { opacity: 0; } }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .splash, .splash-logo { transition: none; }
        .splash-sub, .splash-bar, .splash-tag, .splash-bar > span { animation: none; }
        .splash-bar > span { width: 100%; opacity: 0.5; }
      }
    </style>

  <body>
    <!-- Splash: its own layer above the app; faded out by src/lib/splash.ts when the first screen is ready. -->
    <div id="boot" class="splash" role="status" aria-label="TKU Campus OS 載入中">
      <img class="splash-logo" src="/brand/logo-256.png" width="112" height="112" alt="" />
      <p class="splash-title">TKU Campus OS</p>
      <p class="splash-sub"><span class="splash-zh">淡江智慧校園</span><span class="splash-en">Tamkang Smart Campus</span></p>
      <div class="splash-bar" aria-hidden="true"><span></span></div>
      <p class="splash-tag">One Campus. One OS.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
