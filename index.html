<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A84643" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1B2C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="TKU Campus OS 淡江智慧校園：課表、待辦、校園探索與 AI 校園助理。學生自主開發，非淡江大學官方 App。" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="淡江校園" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <title>TKU Campus OS 淡江智慧校園</title>
    <style>
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        background: linear-gradient(180deg, #A84643 0%, #8A3533 100%); color: #F8F6F1; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif; }
      [data-theme='dark'] .splash { background: #24121A; }
      .splash-tag { margin: 18px 0 0; font-size: 13px; opacity: 0.7; letter-spacing: 0.04em; }
      .splash-logo { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 12px 40px -12px rgb(0 0 0 / 0.45); animation: splash-in 420ms cubic-bezier(.2,.8,.2,1) both; }
      @keyframes splash-in { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; } }
    </style>
    <script>
      try {
        var t = localStorage.getItem('tku.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Splash: shown until React mounts and replaces #root's content. -->
    <div id="root">
      <div class="splash" role="status" aria-label="TKU Campus OS 載入中">
        <img class="splash-logo" src="/brand/logo-256.png" width="128" height="128" alt="" />
        <p class="splash-tag">One Campus. One OS.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
